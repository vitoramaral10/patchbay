[package]
name = "patchbay"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Gateway MCP self-hosted (port em Rust; na F0, só a caixa-preta que julga a paridade com o Go)"
license = "MIT"
publish = false

# O upstream STDIO falso da caixa-preta: o patchbay sob teste o executa como um MCP de processo local.
# É binário e não teste porque o Go precisa de um executável para lançar; o código do servidor é o
# mesmo dos upstreams HTTP falsos (tests/apoio/falso_mcp.rs).
[[bin]]
name = "patchbay-upstream-falso"
path = "tests/apoio/upstream_stdio.rs"
test = false
doc = false

[dependencies]
# Na F0 estas três só servem ao upstream STDIO falso; o binário patchbay ainda é um esboço.
# Fixado: a caixa-preta depende de detalhes do rmcp (MRTR, subscriptions/listen).
rmcp = { version = "=3.12.0", features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
base64 = "0.22"
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
# Os upstreams HTTP falsos e os clientes reais da caixa-preta (mesma versão de cima).
rmcp = { version = "=3.12.0", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
# Só para o despejo do banco depois de cada cena (leitura).
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "net"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
