[package]
name = "patchbay"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Gateway MCP self-hosted (port em Rust, em fatias; ver docs/estudos/2026-11-27-migracao-rust.md)"
license = "MIT"
publish = false

# O upstream STDIO falso da caixa-preta: o patchbay sob teste o executa como um MCP de processo local.
# É binário e não teste porque o Go precisa de um executável para lançar; o código do servidor é o
# mesmo dos upstreams HTTP falsos (tests/apoio/falso_mcp.rs).
[[bin]]
name = "patchbay-upstream-falso"
path = "tests/apoio/upstream_stdio.rs"
test = false
doc = false

[dependencies]
# Cifra de campo (formato pbc1:): AES-256-GCM com chave derivada por HKDF-SHA256, bit a bit como o Go.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Só pela feature: as chaves de rodada do AES e a chave do GHASH zeradas no drop do Cofre.
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
getrandom = "0.4"
hkdf = "0.12"
# O laço de conexões é à mão (como no hersir) por causa do timeout de cabeçalho de 10 s do Go.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service", "server-graceful", "http1"] }
# Instante local do log, no formato do slog do Go.
jiff = "1"
# prctl(PR_SET_DUMPABLE) e o bloco do ambiente (main.rs).
libc = "0.2"
# Fixado: a caixa-preta depende de detalhes do rmcp (MRTR, subscriptions/listen). Na F1 só o
# upstream STDIO falso usa.
rmcp = { version = "=3.12.0", features = ["server", "transport-io"] }
serde_json = "1"
sha2 = "0.10"
# Consultas em tempo de execução, sem macros: o build não depende de DATABASE_URL nem de .sqlx.
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-std", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
zeroize = "1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
base64 = "0.22"
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
# Os upstreams HTTP falsos e os clientes reais da caixa-preta (mesma versão de cima).
rmcp = { version = "=3.12.0", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
# Só para o despejo do banco depois de cada cena (leitura).
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["process", "net"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
