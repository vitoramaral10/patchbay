name: release

# Só em tag "v*" (v0.1.0, v0.1.0-rc1, ...) — nunca em push de branch, para não
# publicar um release por engano a cada commit em main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test (-race)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # task, não go test direto: é o comando que o dev roda localmente
      # (Taskfile.yml), e -race já é a definição de `task test`. O runner é
      # Linux de propósito — -race exige cgo, e é aqui que há compilador C
      # sem precisar de WSL.
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: "3.x"
      - run: task test

  release:
    name: goreleaser + imagem
    needs: test
    runs-on: ubuntu-latest
    # id-token para a assinatura keyless do cosign (OIDC do GitHub, sem chave
    # privada guardada); packages para publicar no GHCR; contents para o
    # goreleaser criar o release e subir os binários.
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico inteiro: o changelog do goreleaser é por commit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser cuida dos binários (linux/darwin/windows, ver
      # .goreleaser.yaml). A imagem multi-arch é publicada à parte, abaixo,
      # por docker/build-push-action — não por `dockers`/`docker_manifests`
      # do goreleaser.
      #
      # Motivo: o recurso de imagem do goreleaser copia um binário
      # pré-compilado para dentro de uma segunda imagem, o que exigiria manter
      # dois Dockerfiles (o multi-stage endurecido deste repositório, para
      # quem builda direto, e um minimal só de COPY para o goreleaser) com a
      # mesma política de hardening duplicada em dois lugares. Como o build já
      # é CGO_ENABLED=0 e não precisa de compilação nativa por arquitetura,
      # buildx com QEMU compila os dois alvos (amd64, arm64) a partir do único
      # Dockerfile em um só passo multi-plataforma — uma fonte de verdade, uma
      # imagem.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: data
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSAO=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATA=${{ steps.data.outputs.iso }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      # SBOM em anexo ao release do GitHub (não só embutido na imagem acima),
      # para responder "esta versão tinha a lib X?" sem puxar a imagem.
      - name: SBOM da imagem publicada
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          artifact-name: patchbay-${{ github.ref_name }}.spdx.json
          upload-release-assets: true

      # Assinatura keyless: sem par de chaves para guardar, a prova de
      # identidade vem do OIDC do próprio workflow (Fulcio + Rekor).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: assinar a imagem publicada
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
