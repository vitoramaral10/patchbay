# Exemplo de deploy do patchbay com o hardening de runtime que o Dockerfile
# sozinho não consegue impor. O TLS não é terminado aqui: ponha na frente o
# proxy reverso ou o túnel que você já usa e aponte `PATCHBAY_PUBLIC_URL` para
# o host público.
#
# `PATCHBAY_MASTER_KEY` não vai em `environment:` de propósito — um valor
# escrito aqui é um segredo versionado. Ela vem de `secrets.env`, um arquivo
# fora do controle de versão (veja `secrets.env.exemplo`), montado só neste
# serviço. Gere a chave com `docker compose run --rm patchbay chave-mestra
# gerar` antes do primeiro `up` — ver a seção "Chave mestra" do README.
services:
  patchbay:
    image: ghcr.io/vitoramaral10/patchbay:latest
    build: .
    container_name: patchbay
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      PATCHBAY_LISTEN: 0.0.0.0:8787
      PATCHBAY_DATA_DIR: /dados
      # Esquema https e o host público: é o que a UI mostra ao cliente MCP e
      # o que decide o atributo Secure do cookie de sessão. O TLS em si é
      # terminado pelo proxy da sua frente, não pelo patchbay.
      PATCHBAY_PUBLIC_URL: https://patchbay.exemplo.com
    # Só no loopback do host: quem atende a internet é o proxy reverso, que
    # repassa para cá. Se o seu proxy for outro container, apague esta
    # publicação e ligue os dois por uma rede compartilhada.
    ports:
      - "127.0.0.1:8787:8787"
    # Volume nomeado, e não bind mount, de propósito: a imagem carrega /dados
    # com dono 65532, e o Docker replica esse dono ao inicializar um volume
    # vazio. Num bind mount quem manda é o dono do diretório no host, então
    # trocar por `./dados:/dados` exige um `chown 65532:65532 ./dados` antes do
    # primeiro `up` — sem isso o SQLite falha com "unable to open database
    # file (14)".
    #
    # Além do banco, /dados guarda o cache de npx e uvx (`/dados/cache`). É de
    # propósito: com o rootfs somente leitura, ele é o único lugar gravável, e
    # cache em volume é o que impede cada reinício de rebaixar todo pacote de
    # MCP de processo local de novo.
    volumes:
      - patchbay-dados:/dados
    # Rootfs somente leitura: o único diretório que o processo escreve é o
    # data dir, montado à parte como volume. /tmp entra por tmpfs porque npx e
    # uvx descompactam pacote ali antes de mover para o cache.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Os dois limites subiram quando a imagem passou a rodar MCP de processo
    # local. Cada um desses MCPs é um processo Node ou Python vivo ao lado do
    # gateway: com 512m e 200 PIDs, três deles já derrubavam o container por
    # OOM, e o modo de falha (morte do PID 1) é bem pior que a lentidão que os
    # limites evitam. Quem só usa MCP remoto pode voltar aos valores antigos.
    pids_limit: 512
    mem_limit: 2g

volumes:
  patchbay-dados:
