# Exemplo de deploy do patchbay com o hardening de runtime que o Dockerfile
# sozinho não consegue impor. O TLS não é terminado aqui: ponha na frente o
# proxy reverso ou o túnel que você já usa e aponte `PATCHBAY_PUBLIC_URL` para
# o host público.
#
# `PATCHBAY_MASTER_KEY` não vai em `environment:` de propósito — um valor
# escrito aqui é um segredo versionado. Ela vem de `secrets.env`, um arquivo
# fora do controle de versão (veja `secrets.env.exemplo`), montado só neste
# serviço. Gere a chave com `docker compose run --rm patchbay chave-mestra
# gerar` antes do primeiro `up` — ver a seção "Chave mestra" do README.
services:
  patchbay:
    image: ghcr.io/vitoramaral10/patchbay:latest
    build: .
    container_name: patchbay
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      PATCHBAY_LISTEN: 0.0.0.0:8787
      PATCHBAY_DATA_DIR: /dados
      # Esquema https e o host público: é o que a UI mostra ao cliente MCP e
      # o que decide o atributo Secure do cookie de sessão. O TLS em si é
      # terminado pelo proxy da sua frente, não pelo patchbay.
      PATCHBAY_PUBLIC_URL: https://patchbay.exemplo.com
    # Só no loopback do host: quem atende a internet é o proxy reverso, que
    # repassa para cá. Se o seu proxy for outro container, apague esta
    # publicação e ligue os dois por uma rede compartilhada.
    ports:
      - "127.0.0.1:8787:8787"
    # Volume nomeado, e não bind mount, de propósito: a imagem carrega /dados
    # com dono 65532, e o Docker replica esse dono ao inicializar um volume
    # vazio. Num bind mount quem manda é o dono do diretório no host, então
    # trocar por `./dados:/dados` exige um `chown 65532:65532 ./dados` antes do
    # primeiro `up` — sem isso o SQLite falha com "unable to open database
    # file (14)".
    #
    # Além do banco, /dados guarda o cache de npx e uvx (`/dados/cache`). É de
    # propósito: com o rootfs somente leitura, ele é o único lugar gravável, e
    # cache em volume é o que impede cada reinício de rebaixar todo pacote de
    # MCP de processo local de novo.
    volumes:
      - patchbay-dados:/dados
    # Rootfs somente leitura: o único diretório que o processo escreve é o
    # data dir, montado à parte como volume. /tmp entra por tmpfs porque npx e
    # uvx descompactam pacote ali antes de mover para o cache.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Os dois limites subiram quando a imagem passou a rodar MCP de processo
    # local. Cada um desses MCPs é um processo Node ou Python vivo ao lado do
    # gateway: com 512m e 200 PIDs, três deles já derrubavam o container por
    # OOM, e o modo de falha (morte do PID 1) é bem pior que a lentidão que os
    # limites evitam. Quem só usa MCP remoto pode voltar aos valores antigos.
    pids_limit: 512
    mem_limit: 2g

  # Opcional (perfil `google`): Gmail, Drive, Docs, Sheets, Slides, Forms,
  # Calendar, Tasks e Contacts pelas APIs comuns do Google, via workspace-mcp
  # (github.com/taylorwilsdon/google_workspace_mcp). Serve para conta pessoal,
  # que o MCP hospedado do Google (drivemcp.googleapis.com) recusa fora do
  # Workspace Developer Preview. Sobe com `docker compose --profile google up -d`
  # e entra no patchbay como upstream HTTP `http://127.0.0.1:8000/mcp`.
  #
  # Roda como provedor OAuth externo: não guarda token nenhum. O /mcp exige
  # Bearer do Google e a metadata de recurso protegido aponta para
  # accounts.google.com, então o patchbay faz o consentimento (upstream em modo
  # OAuth com o client Web pré-registrado; redirect
  # <PATCHBAY_PUBLIC_URL>/admin/upstreams/oauth/callback) e renova o token.
  #
  # Sidecar do patchbay: divide o namespace de rede dele e escuta só em
  # 127.0.0.1, então nenhuma rede alcança a porta — só o processo do patchbay.
  # Loopback também é exigência da go-sdk: ela só busca metadata OAuth por HTTPS
  # ou loopback, e recusaria http://workspace-mcp:8000. Recriar o patchbay exige
  # recriar este.
  workspace-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:latest
    profiles: ["google"]
    container_name: workspace-mcp
    restart: unless-stopped
    # Direto no venv: o CMD da imagem é `uv run`, que no boot baixa do PyPI os
    # pacotes de dev e reconstrói o projeto — supply chain em runtime, e
    # incompatível com rootfs somente leitura.
    entrypoint: ["/app/.venv/bin/python", "main.py"]
    command: ["--transport", "streamable-http", "--tools",
              "drive", "docs", "sheets", "slides", "forms", "gmail", "calendar", "tasks", "contacts"]
    # GOOGLE_OAUTH_CLIENT_ID e GOOGLE_OAUTH_CLIENT_SECRET (veja
    # google.env.exemplo) — os mesmos que vão no upstream do patchbay.
    env_file:
      - google.env
    environment:
      MCP_ENABLE_OAUTH21: "true"
      EXTERNAL_OAUTH21_PROVIDER: "true"
      # Vira o `resource` da metadata: tem de ser a URL que o patchbay usa.
      WORKSPACE_EXTERNAL_URL: http://127.0.0.1:8000
      # Só o loopback do namespace compartilhado com o patchbay.
      WORKSPACE_MCP_HOST: 127.0.0.1
      # Nenhuma ferramenta lê ou grava caminho local do container.
      WORKSPACE_MCP_DISABLE_LOCAL_FILES: "true"
      WORKSPACE_MCP_MAX_FILE_BYTES: "26214400"
      FASTMCP_CHECK_FOR_UPDATES: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp:size=256m
      # Anexos temporários (~/.workspace-mcp) e log do servidor.
      - /home/app:size=256m,uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    network_mode: service:patchbay
    depends_on:
      - patchbay

volumes:
  patchbay-dados:
