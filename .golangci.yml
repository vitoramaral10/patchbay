version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - errorlint
    - forbidigo
    - gosec
    - noctx
    - paralleltest
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tparallel

  settings:
    forbidigo:
      # fmt.Print* só na borda do binário; time.Sleep em nenhum lugar.
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: escreva pela borda em cmd/ ou use log/slog
        - pattern: ^time\.Sleep$
          msg: espere por sinal (canal, WaitGroup), nunca pelo relógio
    sloglint:
      no-mixed-args: true
      key-naming-case: snake
    gosec:
      excludes:
        # G115 (conversão de inteiro) tem falso positivo demais em id de linha.
        - G115

  exclusions:
    generated: lax
    rules:
      # cmd/ é a borda: pode imprimir na saída padrão.
      - path: ^cmd/
        linters: [forbidigo]
      # Teste pode fechar sobre erro esperado sem contexto de request. gosec
      # sai porque credencial de mentira em tabela de caso (G101) e go list em
      # subprocesso (G204) são o assunto do teste, não achado.
      - path: _test\.go$
        linters: [contextcheck, noctx, bodyclose, gosec]
      # templ: o construtor de componente (TelaX(...)) é fábrica pura — o
      # contexto entra depois, no Render(ctx, w) que webui.Renderizar chama.
      # contextcheck atravessa as closures geradas em *_templ.go e conclui que a
      # chamada do construtor devia receber ctx. A exclusão é amarrada à
      # mensagem e à linha do Renderizar, para não silenciar achado de verdade.
      - linters: [contextcheck]
        text: "should pass the context parameter"
        source: "webui.Renderizar"
      # A mesma falsa positiva, um salto adiante: as duas ajudantes de
      # comando_http.go renderizam pelo webui.Renderizar, e o contextcheck
      # atravessa as closures do templ e aponta a linha que as chama, não a do
      # Renderizar — que a exclusão acima já cobre.
      - linters: [contextcheck]
        text: "should pass the context parameter"
        source: 'a\.(recusar|textoDoPedido)\('
      # comando.go devolve erro que é texto de tela: a caixa de colar mostra a
      # frase inteira ao admin, com maiúscula e ponto final. ST1005 pede o
      # contrário, e o contrário aqui produziria "cole o comando de instalação"
      # em minúscula no meio de um alerta.
      - path: internal/upstream/comando\.go$
        linters: [staticcheck]
        text: "ST1005"

formatters:
  enable:
    - gofmt
